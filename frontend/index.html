<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DirectLink AI | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #otpSection {
      display: none;
      margin-top: 20px;
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #2563eb;
      min-height: 20px;
    }

    .footer {
      margin-top: 25px;
      color: #94a3b8;
      font-size: 12px;
    }

    .success {
      color: #16a34a !important;
    }

    .error {
      color: #dc2626 !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">DirectLink AI</div>
    <p class="subtitle">Connect. Trade. Grow.</p>

    <div class="input-group">
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter 10-digit phone number"
        maxlength="10"
      />
    </div>

    <button id="sendBtn" onclick="requestOTP()">Send OTP</button>

    <div id="otpSection">
      <div class="input-group">
        <label for="otp">Enter OTP</label>
        <input
          type="text"
          id="otp"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
        />
      </div>

      <button id="verifyBtn" onclick="verifyOTP()">Verify & Login</button>
    </div>

    <p id="message"></p>

    <div class="footer">
      © 2026 DirectLink AI. All rights reserved.
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:4000";

    function showMessage(text, type = "") {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = type;
    }

    async function requestOTP() {
      const phone = document.getElementById("phone").value.trim();
      const sendBtn = document.getElementById("sendBtn");

      if (!/^\d{10}$/.test(phone)) {
        showMessage("Please enter a valid 10-digit phone number.", "error");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "Sending...";

      try {
        const response = await fetch(`${API_URL}/auth/request-otp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            phone,
            role: "buyer"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || "Failed to send OTP");
        }

        document.getElementById("otpSection").style.display = "block";
        showMessage("OTP sent successfully!", "success");
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Resend OTP";
      }
    }

    async function verifyOTP() {
      const phone = document.getElementById("phone").value.trim();
      const otp = document.getElementById("otp").value.trim();
      const verifyBtn = document.getElementById("verifyBtn");

      if (!/^\d{6}$/.test(otp)) {
        showMessage("Please enter a valid 6-digit OTP.", "error");
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = "Verifying...";

      try {
        const response = await fetch(`${API_URL}/auth/verify-otp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            phone,
            otp,
            role: "buyer"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || "Verification failed");
        }

        localStorage.setItem("accessToken", data.accessToken);
        localStorage.setItem("refreshToken", data.refreshToken);

        showMessage("Login successful! Welcome to DirectLink AI.", "success");
        verifyBtn.textContent = "Logged In ✓";
      } catch (error) {
        showMessage(error.message, "error");
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify & Login";
      }
    }
  </script>
</body>
</html>
