<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DirectLink AI - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #334155;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #otpSection {
      display: none;
      margin-top: 20px;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>DirectLink AI</h1>
   <p class="subtitle">Choose SMS or WhatsApp to receive your OTP</p>

    <label for="phone">Phone Number</label>

    <input
      type="tel"
      id="phone"
      placeholder="Enter 10-digit number"
      maxlength="10"
    />

    <label for="role">Select Role</label>

    <select id="role">
      <option value="buyer">Buyer</option>
      <option value="farmer">Farmer</option>
    </select>

    <label for="otpMethod">OTP Delivery Method</label>

    <select id="otpMethod">
      <option value="whatsapp">WhatsApp</option>
      <option value="sms">SMS</option>
    </select>

    <button id="sendBtn" onclick="requestOTP()">
      Send OTP
    </button>

    <div id="otpSection">
      <label for="otp">Enter OTP</label>

      <input
        type="text"
        id="otp"
        placeholder="Enter 6-digit OTP"
        maxlength="6"
      />

      <button id="verifyBtn" onclick="verifyOTP()">
        Verify & Login
      </button>
    </div>

    <p id="message"></p>
  </div>

  <script>
    const API_URL = "http://localhost:4000";

    function showMessage(text, type = "") {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = type;
    }

    async function requestOTP() {
      const phone = document.getElementById("phone").value.trim();
      const role = document.getElementById("role").value;
      const otpMethod = document.getElementById("otpMethod").value;
      const sendBtn = document.getElementById("sendBtn");

      if (!/^[0-9]{10}$/.test(phone)) {
        showMessage(
          "Please enter a valid 10-digit phone number.",
          "error"
        );
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "Sending...";

      try {
        const response = await fetch(`${API_URL}/auth/request-otp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            phone,
            role,
            otpMethod
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || data.error || "Failed to send OTP"
          );
        }

        document.getElementById("otpSection").style.display = "block";

        showMessage(
          `OTP sent successfully through ${
            otpMethod === "sms" ? "SMS" : "WhatsApp"
          }!`,
          "success"
        );

        sendBtn.textContent = "Resend OTP";
      } catch (error) {
        console.error("OTP request error:", error);

        showMessage(
          error.message || "Failed to send OTP",
          "error"
        );

        sendBtn.textContent = "Send OTP";
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function verifyOTP() {
      const phone = document.getElementById("phone").value.trim();
      const otp = document.getElementById("otp").value.trim();
      const verifyBtn = document.getElementById("verifyBtn");

      if (!/^[0-9]{6}$/.test(otp)) {
        showMessage(
          "Please enter a valid 6-digit OTP.",
          "error"
        );
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = "Verifying...";

      try {
        const response = await fetch(`${API_URL}/auth/verify-otp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            phone,
            otp
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || data.error || "Verification failed"
          );
        }

        localStorage.setItem("accessToken", data.accessToken);
        localStorage.setItem("refreshToken", data.refreshToken);

        showMessage(
          "Login successful! Welcome to DirectLink AI.",
          "success"
        );

        verifyBtn.textContent = "Logged In ✓";
      } catch (error) {
        console.error("OTP verification error:", error);

        showMessage(
          error.message || "OTP verification failed",
          "error"
        );

        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify & Login";
      }
    }
  </script>
</body>
</html>
